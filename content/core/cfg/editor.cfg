bind "f1" "toggleeditor"

bindctx "editor" "w" "+ed_forward"
bindctx "editor" "a" "+ed_left"
bindctx "editor" "s" "+ed_backward"
bindctx "editor" "d" "+ed_right"

bindctx "editor" "e" "+ed_up"
bindctx "editor" "q" "+ed_down"

bindctx "editor" "mouse2" "+ed_look"

bindctx "editor" "mwheelup" "+ed_speedup"
bindctx "editor" "mwheeldown" "+ed_slowdown"