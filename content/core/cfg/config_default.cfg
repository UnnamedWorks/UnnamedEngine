//-----------------------------------------------------------------------------
// 入力コンテキストの設定
//-----------------------------------------------------------------------------
inputcontext "game"    "pass_through"
inputcontext "editor"  "pass_through"
inputcontext "console" "block_lower"

//-----------------------------------------------------------------------------
// 入力バインド
// KeyNameTable.cppに各キーに対応する名前が書いてあります。
//-----------------------------------------------------------------------------

//-----------------------------------------------------------------------------
// Global / System
//-----------------------------------------------------------------------------

bind "escape" "togglelockcursor"
bind "`"      "toggleconsole"
bind "f11"    "togglefullscreen"

//-----------------------------------------------------------------------------
// Gameplay - Keyboard
//-----------------------------------------------------------------------------

bindctx "game" "w"     "+forward"
bindctx "game" "s"     "+back"
bindctx "game" "a"     "+moveleft"
bindctx "game" "d"     "+moveright"

bindctx "game" "e"     "+moveup"
bindctx "game" "q"     "+movedown"

bindctx "game" "space" "+jump"
bindctx "game" "shift" "+sprint"

bindctx "game" "c"     "+duck"
bindctx "game" "ctrl"  "+duck"

bindctx "game" "k" "toggle noclip"

//-----------------------------------------------------------------------------
// Gameplay - Mouse
//-----------------------------------------------------------------------------

bindctx "game" "mouse1" "+attack1"
bindctx "game" "mouse2" "+attack2"

bindctx "game" "r" "+reload"

bindctx "game" "mwheelup"   "+invprev"
bindctx "game" "mwheeldown" "+invnext"

// Grapple
bindctx "game" "mouse2" "+grapple"
bindctx "game" "mouse4" "+reelin"
bindctx "game" "mouse5" "+reelout"

//-----------------------------------------------------------------------------
// Gameplay - Gamepad
//-----------------------------------------------------------------------------

bindctx "game" "gp_a"  "+jump"
bindctx "game" "gp_b"  "+duck"
bindctx "game" "gp_ls" "+sprint"

bindctx "game" "gp_rt" "+attack1"
bindctx "game" "gp_lt" "+attack2"
bindctx "game" "gp_x"  "+reload"

//-----------------------------------------------------------------------------
// Editor
//-----------------------------------------------------------------------------

bindctx "editor" "4"   "+bounds"
bindctx "editor" "1"   "+translate"
bindctx "editor" "2"   "+rotate"
bindctx "editor" "3"   "+scale"
bindctx "editor" "tab" "+togglegizmo"

//-----------------------------------------------------------------------------
// Rendering
//-----------------------------------------------------------------------------

r_shadowmap_enabled 0