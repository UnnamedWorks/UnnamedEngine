//-----------------------------------------------------------------------------
// 入力コンテキストの設定
//-----------------------------------------------------------------------------
inputcontext "game" "pass_through"
inputcontext "editor" "pass_through"
inputcontext "console" "block_lower" // コンソール入力は他の入力をブロックする

bindctx "game" "t" "+forward"

//-----------------------------------------------------------------------------
// 入力バインド
// KeyNameTable.cppに各キーに対応する名前が書いてあります。
//-----------------------------------------------------------------------------

// -- 共通 -- //
bind "escape" "togglelockcursor" // カーソルロックの切り替え
bind "f11" "togglefullscreen"

// 移動
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
// 上下移動はnoclipでのみ有効
bind "e" "+moveup"
bind "q" "+movedown"

// -- ゲーム -- //
bind "space" "+jump" // ジャンプ
bind "gp_a" "+jump" // ジャンプ(ゲームパッド)

bind "shift" "+sprint" // スプリント
bind "gp_ls" "+sprint" // スプリント(ゲームパッド)

bind "c" "+duck" // しゃがみ
bind "ctrl" "+duck" // しゃがみ
bind "gp_b" "+duck" // しゃがみ(ゲームパッド)

bind "mouse1" "+attack1" // 攻撃
bind "mouse2" "+attack2" // 攻撃2
bind "gp_rt" "+attack1" // 攻撃(ゲームパッド)
bind "gp_lt" "+attack2" // 攻撃2(ゲームパッド)

bind "r" "+reload" // リロード
bind "gp_x" "+reload" // リロード(ゲームパッド)

bind "mwheelup" "+invprev"
bind "mwheeldown" "+invnext"

// パルクール
bind "mouse2" "+grapple"
bind "mouse4" "+reelin"
bind "mouse5" "+reelout"

// -- エディター -- //
bind "`" "toggleconsole" // コンソールの表示切り替え
bind "f1" "toggleeditor" // エディタ表示の切り替え

bind "1" "+translate" // 移動
bind "2" "+rotate" // 回転
bind "3" "+scale" // 拡縮
bind "4" "+bounds" // 境界

bind "tab" "+togglegizmo" // 